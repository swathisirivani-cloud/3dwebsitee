<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 3D Cube</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      font-family: Arial, sans-serif;
    }

    .scene {
      width: 200px;
      height: 200px;
      perspective: 800px;          /* how far the viewer is from the screen */
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d; /* keep children in 3D */
      animation: spin 8s linear infinite;
    }

    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.6);
      opacity: 0.9;
    }

    .front  { background: #7c3aed; transform: translateZ(100px); }
    .back   { background: #2563eb; transform: rotateY(180deg) translateZ(100px); }
    .right  { background: #db2777; transform: rotateY(90deg) translateZ(100px); }
    .left   { background: #059669; transform: rotateY(-90deg) translateZ(100px); }
    .top    { background: #d97706; transform: rotateX(90deg) translateZ(100px); }
    .bottom { background: #dc2626; transform: rotateX(-90deg) translateZ(100px); }

    @keyframes spin {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to   { transform: rotateX(360deg) rotateY(360deg); }
    }

    .cube:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="cube">
      <div class="face front">HTML</div>
      <div class="face back">CSS</div>
      <div class="face right">JS</div>
      <div class="face left">C</div>
      <div class="face top">AI</div>
      <div class="face bottom">3D</div>
    </div>
  </div>
</body>
</html>
